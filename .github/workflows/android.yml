name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build APKs
        working-directory: frontend/android
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Sign release APK
        working-directory: frontend/android/app/build/outputs/apk/release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "No keystore secret: generating a one-off key (updates will require uninstalling first)"
            PASS="acctiq-temp-pass"; ALIAS="acctiq"
            keytool -genkeypair -keystore ks.jks -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ACCTIQ"
          fi
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out acctiq-release.apk aligned.apk
          "$BT/apksigner" verify acctiq-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: acctiq-release-apk
          path: frontend/android/app/build/outputs/apk/release/acctiq-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: acctiq-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
